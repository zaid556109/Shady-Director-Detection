[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterparty-check-backend"
version = "0.1.0"
description = "FastAPI + Celery backend for CounterpartyCheck."
requires-python = ">=3.11"
dependencies = [
    # `contracts` (../contracts) is a separate local package, not listed here:
    # pip's `file://../contracts` relative-URI form isn't portable across
    # platforms. Install it first — `make setup` and CI both run
    # `pip install -e contracts` before this package, in that order.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "celery>=5.4",
    "redis>=5.0",
    "networkx>=3.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
