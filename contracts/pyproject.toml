[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contracts"
version = "0.1.0"
description = "Frozen-ish Pydantic v2 data contracts shared across CounterpartyCheck backend, workers, and frontend codegen."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
